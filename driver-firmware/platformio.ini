; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Which environment the Upload button and a bare "pio run" act on.
;
; Without this, both environments run, and the second one flashed wins. The
; board then holds sd_test rather than the instrument firmware, with nothing
; in the output saying so: both uploads report success, because both did
; succeed. Build or flash the card test by naming it, "pio run -e sd_test".
[platformio]
default_envs = pico2

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino

; Carves a LittleFS partition out of the flash, for the calibration store in
; src/main.cpp. Without this the partition is zero bytes, LittleFS.begin()
; fails, and the device runs with cal_store=0: everything still works, but
; the calibration does not survive a power cycle. 64k is one erase block more
; than the store needs and costs the sketch nothing it uses.
board_build.filesystem_size = 64k

; Regenerates src/*.pio.h from src/*.pio before each build. Without this,
; editing a .pio file and forgetting to run pioasm by hand yields firmware
; that builds and flashes cleanly while still containing the OLD PIO
; program, with no warning anywhere. See tools/build_pio.py.
extra_scripts = pre:tools/build_pio.py

; sd_test.cpp is a standalone program with its own setup()/loop(). It must
; never link with main.cpp, so each environment excludes the other file.
build_src_filter = +<*> -<sd_test.cpp> -<rtc_test.cpp>

; SD card bring-up test. Builds src/sd_test.cpp alone:
;   pio run -e sd_test -t upload
;   pio device monitor -e sd_test
[env:sd_test]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
build_src_filter = -<*> +<sd_test.cpp>
monitor_speed = 115200

; DS3231 clock bring-up test. Builds src/rtc_test.cpp alone:
;   pio run -e rtc_test -t upload
;   pio device monitor -e rtc_test
;
; The bus is bit-banged. The board has SCL on GPIO 20 and SDA on GPIO 21,
; which the RP2350 I2C block cannot map: SDA must be an even pin and SCL odd.
; See the header comment in src/rtc_test.cpp.
[env:rtc_test]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
build_src_filter = -<*> +<rtc_test.cpp>
monitor_speed = 115200
